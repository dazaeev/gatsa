# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Spring Application Name
spring.application.name=gatsa-ecosystem-backend

# MySQL 8 Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/gatsa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Servlet Multipart Configuration (Carga de Archivos PDF / Imagen hasta 25MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

